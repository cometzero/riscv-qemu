image sdcard.img {
    hdimage {
    }

    partition boot {
        partition-type = 0xC
        bootable = "true"
        image = "boot.vfat"
    }

    partition rootfs {
        partition-type = 0x83
        image = "rootfs.ext2"
    }
}

image boot.vfat {
    vfat {
        files = {
            "Image",
            "extlinux"
        }
    }
    size = 64M
}
