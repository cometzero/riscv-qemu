# U-Boot configuration for QEMU RISC-V with virtio disk boot
# Applied on top of qemu-riscv64_spl_defconfig

# Set bootargs for console
CONFIG_BOOTARGS="console=ttyS0 earlycon=sbi"

# Boot delay (seconds)
CONFIG_BOOTDELAY=2

# Boot command - load kernel and initramfs from virtio disk (whole disk FAT)
# virtio 0:0 means disk 0, no partition (whole disk as filesystem)
CONFIG_USE_BOOTCOMMAND=y
CONFIG_BOOTCOMMAND="virtio scan; load virtio 0:0 0x84000000 Image && load virtio 0:0 0x88000000 initrd.img && booti 0x84000000 0x88000000:${filesize} ${fdtcontroladdr}"

# Enable virtio support
CONFIG_VIRTIO=y
CONFIG_VIRTIO_MMIO=y
CONFIG_VIRTIO_BLK=y
CONFIG_CMD_VIRTIO=y
