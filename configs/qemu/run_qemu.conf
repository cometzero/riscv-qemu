# QEMU run configuration for RISC-V virt machine
# Used by scripts/run_qemu.sh

# Machine configuration
QEMU_MACHINE=virt
QEMU_MEMORY=256M
QEMU_SMP=1

# Serial console
QEMU_SERIAL=mon:stdio

# Boot images (relative to build directory)
QEMU_BIOS=u-boot/spl/u-boot-spl.bin
QEMU_FIT=u-boot/u-boot.itb
QEMU_FIT_ADDR=0x80200000
