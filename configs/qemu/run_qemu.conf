# QEMU run configuration for RISC-V virt machine
# Used by scripts/run_qemu.sh
#
# Memory Layout (must be consistent with DTS and U-Boot defconfig):
#   0x80000000: SPL/OpenSBI (via -bios)
#   0x80200000: FIT image (U-Boot proper)
#   0x84000000: Kernel load address
#   0x88000000: Initramfs load address
#
# Minimum RAM required: 512M (to fit kernel+initrd above 0x84000000)
# Recommended: 4G for comfortable experimentation

# Machine configuration
QEMU_MACHINE=virt
QEMU_MEMORY=4G
QEMU_SMP=2

# Serial console
QEMU_SERIAL=mon:stdio

# Boot images (relative to BUILD_DIR)
QEMU_BIOS=u-boot/spl/u-boot-spl.bin
QEMU_FIT=u-boot/u-boot.itb
QEMU_FIT_ADDR=0x80200000

# Kernel/Initrd load addresses (used in boot.scr)
KERNEL_LOAD_ADDR=0x84000000
INITRD_LOAD_ADDR=0x88000000
